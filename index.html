<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تخمين الرقم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #2b2b3d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #00d26a;
            margin-bottom: 10px;
        }
        p {
            color: #a9a9b3;
        }
        input[type="number"] {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #3f3f5a;
            border-radius: 6px;
            background-color: #1e1e2e;
            color: #fff;
            font-size: 18px;
            text-align: center;
        }
        button {
            background-color: #00d26a;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #00b359;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🎯 لعبة تخمين الرقم</h1>
        <p>اخترنا رقماً عشوائياً بين 1 و 100. هل يمكنك معرفته؟</p>
        
        <input type="number" id="guessInput" placeholder="أدخل رقمك هنا" min="1" max="100">
        <br>
        <button onclick="checkGuess()">تحقق من الرقم</button>

        <p id="message"></p>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const guess = parseInt(document.getElementById('guessInput').value);
            const message = document.getElementById('message');

            if (isNaN(guess) || guess < 1 || guess > 100) {
                message.style.color = '#ff4d4d';
                message.innerText = 'الرجاء إدخال رقم صحيح بين 1 و 100!';
                return;
            }

            attempts++;

            if (guess === randomNumber) {
                message.style.color = '#00d26a';
                message.innerText = `🎉 مبروك! إجابة صحيحة. الرقم هو ${randomNumber}. عدد المحاولات: ${attempts}`;
            } else if (guess > randomNumber) {
                message.style.color = '#ffaa00';
                message.innerText = '📉 الرقم المطلوب أصغر من هذا الرقم!';
            } else {
                message.style.color = '#ffaa00';
                message.innerText = '📈 الرقم المطلوب أكبر من هذا الرقم!';
            }
        }
    </script>

</body>
</html>
